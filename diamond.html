<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .background-art{
            color:#00000070;
        }

        .svgbox{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 使SVG居中 */
            width: 300px;
            height: 300px;
        }
        .background-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #f5f5f5; /* 可以選擇合適的背景色 */
        }

        .circle {
            fill: none;
            stroke: #b39363;
            stroke-width: 4;
            stroke-dasharray: 0.5, 9, 0.5, 20.7, 0.5, 9, 0.5, 9;
            stroke-linecap: round;
            transform-origin: 50% 50%;
            transform: rotate(18deg);
        }

        svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* 使SVG居中 */
            width: 300px;
            height: 300px;
        }
    </style>
    <title>背景圖形</title>
</head>
<body>
    <div class="background-container">
        <svg viewBox="0 0 300 300">
            <circle class="circle" cx="150" cy="150" r="95"></circle>
        </svg>
    </div>
</body>
</html>
