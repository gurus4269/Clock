<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁時鐘</title>
    <!--icon-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!--字體-->
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <!--CSS檔案-->
    <link rel="stylesheet" href="ClockCSS.css">
</head>

<body>
    <!--裝日曆和時鐘-->
    <div class="container">
        <div class="calendarcircle">
            <!--日曆-->
            <div class="calendar">
                <div id="year"></div>
                <div id="month"></div>
                <div id="day"></div>
            </div>
            <!--日曆外圍的圈圈-->
            <svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
                <circle cx="300" cy="300" r="199" fill="none" stroke="#c8a679" stroke-width="10" stroke-dasharray="1, 20,1,40,1,20,1,20" stroke-linecap="round" />
            </svg>
        </div>
        <!--時鐘-->
        <div id="clock">
            <svg width="100%" height="100%" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

                <!--最外層正方形-->
                <rect id="square" x="50" y="50" width="200" height="200" transform="rotate(45 150 150)" rx="5" ry="5" />
                
                <!--第一個內切圓 : 由一個點點邊框圓圈、12個水滴組成-->
                <circle class="circle" cx="150" cy="150" r="95"></circle>
                <g transform="translate(157, 66)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(180)"/></g>
                <g transform="translate(195.5, 81.73)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(210)"/></g>
                <g transform="translate(225.27, 113.5)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(240)"/></g>
                <g transform="translate(234.0, 156.0)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(270)"/></g>
                <g transform="translate(220.27, 198.5)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(300)"/></g>
                <g transform="translate(186.5, 225.27)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(330)"/></g>
                <g transform="translate(145.0, 234.0)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(0)"/></g>
                <g transform="translate(103.5, 218.27)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(30)"/></g>
                <g transform="translate(74.73, 186.5)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(60)"/></g>
                <g transform="translate(66.0, 144.0)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(90)"/></g>
                <g transform="translate(79.73, 101.5)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(120)"/></g>
                <g transform="translate(113.5, 74.3)"><path class="drop" d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0l1.8 0c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z" transform="scale(0.03, 0.03) rotate(150)"/></g>

                <!--內接正三角形-->
                <polygon id="triangle" points="150,60 230,195 70,195" stroke-linecap="round"></polygon>
                
                <!--第二個內切圓-->
                <circle id="innerCircle" cx="150" cy="150" r="45"></circle>

                <!--時針-->
                <line id="hourHand" x1="150" y1="150" x2="150" y2="108" stroke-linecap="round"></line> 
                <line id="hourHandinner" class="lineinner" x1="150" y1="150" x2="150" y2="104" stroke-linecap="round"></line>
                
                <!--分針-->
                <line id="minuteHand" x1="150" y1="150" x2="150" y2="63"stroke-linecap="round"></line>
                <line id="minuteHandinner" class="lineinner" x1="150" y1="150" x2="150" y2="58.2"stroke-linecap="round"></line>

                <!--秒針-->
                <line id="secondHand" x1="150" y1="150" x2="150" y2="11"stroke-linecap="round"></line>
                <line id="secondHandinner"class="lineinner" x1="150" y1="150" x2="150" y2="7"stroke-linecap="round"></line>
            </svg>
            <!--表單按鈕-->
            <div class="openModalBtn" id="editTime">
                <button id="openModalBtn">
                    <i class="fa-solid fa-pen-to-square"></i>
                </button>
            </div>

            <!--互動視窗-->
            <div id="myModal" class="modal">
                <div class="modal-content">
                    <h2 class = "title">時間調整</h2>
                    <br>
                    <!--表單-->
                    <form id="timeForm">
                        <input type="number" id="hours" name="hours" min="1" max="12" placeholder="HH" required>
                        <label for="hours">時</label>
                        
                        <input type="number" id="minutes" name="minutes" min="0" max="59" placeholder="MM" required>
                        <label for="minutes">分</label>
                        
                        <input type="number" id="seconds" name="seconds" min="0" max="59" placeholder="SS" required>
                        <label for="seconds">秒</label>
                        <br><br><br>
                        <button type="submit" class="button fa-solid fa-check"></button>
                        <button class="button fa-solid fa-xmark" id="closeModalBtn"></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!--javascript檔案-->
    <script src="ClockScript.js"></script>
</body>
</html>
